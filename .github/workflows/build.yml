name: build

on:
  push:
    branches: [main, lab3]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
      - "docker-compose.yml"
      - "deploy.sh"
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия для повторного деплоя или отката (например, 20261111-101500). Пусто — собрать новую."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      rebuild: ${{ steps.v.outputs.rebuild }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.VERSION }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Повторный деплой версии **$INPUT_VERSION**" >> "$GITHUB_STEP_SUMMARY"
          else
            VERSION=$(date -u +%Y%m%d-%H%M%S)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Версия сборки: **$VERSION**" >> "$GITHUB_STEP_SUMMARY"
          fi


  test:
    needs: version
    if: needs.version.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            workdir: /src
            test_cmd: |
              set -e
              go install github.com/jstemmer/go-junit-report/v2@v2.1.0
              set +e
              CGO_ENABLED=0 go test -v -coverprofile=/reports/coverage.out ./... > /reports/test.log 2>&1
              rc=$?
              set -e
              "$(go env GOPATH)/bin/go-junit-report" < /reports/test.log > /reports/junit.xml
              [ -f /reports/coverage.out ] && go tool cover -func=/reports/coverage.out > /reports/coverage.txt || true 
              exit $rc

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Собрать builder-стадию
        run: docker build --target builder -t test-${{ matrix.service }}:ci "src/${{ matrix.service }}"

      - name: Запустить тесты в контейнере
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD/reports:/reports" \
            -w "${{ matrix.workdir }}" \
            -e JEST_JUNIT_OUTPUT_DIR=/reports \
            -e JEST_JUNIT_OUTPUT_NAME=junit.xml \
            test-${{ matrix.service }}:ci \
            sh -c "$TEST_CMD"
        env:
          TEST_CMD: ${{ matrix.test_cmd }}

      - name: Опубликовать отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: reports/
          if-no-files-found: warn

  build:
    needs: [version, test]
    if: needs.version.outputs.rebuild == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            nexus_repo: kashapova-backend-docker
          - service: frontend
            nexus_repo: kashapova-frontend-docker
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.service }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Разрешить Docker работать с Nexus по HTTP
        run: |
          f=/etc/docker/daemon.json
          [ -f "$f" ] || echo '{}' | sudo tee "$f" > /dev/null
          sudo jq --arg r "$NEXUS_HOST" '. + {"insecure-registries": [$r]}' "$f" | sudo tee "$f.new" > /dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker

      - name: Вход в ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Вход в Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: printf '%s' "$NEXUS_PASS" | docker login "$NEXUS_HOST" -u "$NEXUS_USER" --password-stdin

      - name: Сформировать теги
        run: |
          NEXUS_IMAGE="$NEXUS_HOST/${{ matrix.nexus_repo }}/sandbox-${{ matrix.service }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          TAGS="$VERSION $SHA_TAG"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS="$TAGS latest"
          fi
          echo "NEXUS_IMAGE=$NEXUS_IMAGE" >> "$GITHUB_ENV"
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"
          echo "Теги: $TAGS"

      - name: Сборка образа
        run: |
          ARGS=""
          for t in $TAGS; do
            ARGS="$ARGS -t $GHCR_IMAGE:$t -t $NEXUS_IMAGE:$t"
          done
          docker build --target runtime \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            $ARGS \
            "src/${{ matrix.service }}"

      - name: Публикация в ghcr.io
        run: |
          for t in $TAGS; do docker push "$GHCR_IMAGE:$t"; done

      - name: Публикация в Nexus
        run: |
          for t in $TAGS; do docker push "$NEXUS_IMAGE:$t"; done

      - name: Итог
        run: |
          {
            echo "### ${{ matrix.service }} — $VERSION"
            for t in $TAGS; do
              echo "- \`$GHCR_IMAGE:$t\`"
              echo "- \`$NEXUS_IMAGE:$t\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Деплой (concurrency уже был) ----
  deploy:
    needs: [version, test, build]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY_KIND: ${{ vars.IMAGE_REGISTRY || 'nexus' }}
      NEXUS_PREFIX: kashapova
      APP_DIR: sandbox
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "$VM_HOST" "$VM_USER" > ~/.ssh/config

      - name: Сформировать .env
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          OWNER: ${{ github.repository_owner }}
        run: |
          case "$REGISTRY_KIND" in
            ghcr)
              IMAGE_REGISTRY="ghcr.io"
              REPO_BACKEND="ghcr.io/$OWNER/sandbox-backend"
              REPO_FRONTEND="ghcr.io/$OWNER/sandbox-frontend"
              ;;
            nexus)
              IMAGE_REGISTRY="$NEXUS_HOST"
              REPO_BACKEND="$NEXUS_HOST/$NEXUS_PREFIX-backend-docker/sandbox-backend"
              REPO_FRONTEND="$NEXUS_HOST/$NEXUS_PREFIX-frontend-docker/sandbox-frontend"
              ;;
            *) echo "IMAGE_REGISTRY должен быть nexus или ghcr" >&2; exit 1 ;;
          esac
          printf '%s\n' "$APP_ENV_FILE" | tr -d '\r' \
            | grep -vE '^(IMAGE_REGISTRY|IMAGE_TAG|VERSION|REPOSITORY_BACKEND|REPOSITORY_FRONTEND)=' > .env || true
          {
            echo "IMAGE_REGISTRY=$IMAGE_REGISTRY"
            echo "REPOSITORY_BACKEND=$REPO_BACKEND"
            echo "REPOSITORY_FRONTEND=$REPO_FRONTEND"
            echo "IMAGE_TAG=$VERSION"
            echo "VERSION=$VERSION"
          } >> .env
          echo "Registry для деплоя: $REGISTRY_KIND, версия $VERSION"

      - name: Скопировать файлы на VM
        run: |
          ssh vm "mkdir -p ~/$APP_DIR"
          scp docker-compose.yml .env deploy.sh vm:~/$APP_DIR/

      - name: Развернуть и проверить
        env:
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REGISTRY_KIND" = "ghcr" ]; then
            USER_NAME="$OWNER"; PASS="$GHCR_PAT"
          else
            USER_NAME="$NEXUS_USER"; PASS="$NEXUS_PASS"
          fi
          printf '%s' "$PASS" | ssh vm "REGISTRY_USER='$USER_NAME' sh ~/$APP_DIR/deploy.sh"

      - name: Итог
        run: |
          echo "Развёрнута версия **$VERSION** (registry $REGISTRY_KIND)" >> "$GITHUB_STEP_SUMMARY"