# Сборка образов backend и frontend и публикация в два registry:

name: build

on:
  push:
    branches: [main, lab3]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write 

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия сборки: **$VERSION**" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            nexus_repo: kashapova-backend-docker
          - service: frontend
            nexus_repo: kashapova-frontend-docker
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.service }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Разрешить Docker работать с Nexus по HTTP
        run: |
          f=/etc/docker/daemon.json
          [ -f "$f" ] || echo '{}' | sudo tee "$f" > /dev/null
          sudo jq --arg r "$NEXUS_HOST" '. + {"insecure-registries": [$r]}' "$f" | sudo tee "$f.new" > /dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker

      - name: Вход в ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Вход в Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: printf '%s' "$NEXUS_PASS" | docker login "$NEXUS_HOST" -u "$NEXUS_USER" --password-stdin

      - name: Сборка образа
        run: |
          NEXUS_IMAGE="$NEXUS_HOST/${{ matrix.nexus_repo }}/sandbox-${{ matrix.service }}"
          echo "NEXUS_IMAGE=$NEXUS_IMAGE" >> "$GITHUB_ENV"
          docker build --target runtime \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$GHCR_IMAGE:$VERSION" -t "$GHCR_IMAGE:latest" \
            -t "$NEXUS_IMAGE:$VERSION" -t "$NEXUS_IMAGE:latest" \
            "src/${{ matrix.service }}"

      - name: Публикация в ghcr.io
        run: |
          docker push "$GHCR_IMAGE:$VERSION"
          docker push "$GHCR_IMAGE:latest"

      - name: Публикация в Nexus
        run: |
          docker push "$NEXUS_IMAGE:$VERSION"
          docker push "$NEXUS_IMAGE:latest"

      - name: Итог
        run: |
          {
            echo "### ${{ matrix.service }} — $VERSION"
            echo "- \`$GHCR_IMAGE:$VERSION\`"
            echo "- \`$NEXUS_IMAGE:$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"