name: sandbox                      

services:
  backend:
    image: ${REGISTRY:-}sandbox-backend:${BACKEND_TAG:-latest}   
    container_name: sandbox-backend
    env_file:
      - .env                        
    networks:
      - sandbox-net
    restart: unless-stopped         

  frontend:
    image: ${REGISTRY:-}sandbox-frontend:${FRONTEND_TAG:-latest}
    container_name: sandbox-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-8888}:8888"   
    depends_on:
      - backend                     
    networks:
      - sandbox-net
    restart: unless-stopped

networks:
  sandbox-net:                      
    name: sandbox-net
    driver: bridge